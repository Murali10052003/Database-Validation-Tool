services:
  migration-validator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: "${MV_IMAGE:-migration-validator:local}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MV_PORT:-8000}:8000"
    environment:
      MV_CATALOG_PATH: /app/data/catalog.sqlite3
      MV_REPORT_DIR: /app/data/reports
      MV_RUN_LOG_DIR: /app/data/logs
      MV_RUN_LOG_RETENTION_DAYS: "0"
      MV_LOG_LEVEL: INFO
      MV_ENTRA_CLIENT_ID: "${MV_ENTRA_CLIENT_ID:-}"
      MV_ENTRA_TENANT_ID: "${MV_ENTRA_TENANT_ID:-}"
    volumes:
      - type: bind
        source: "${MV_HOST_DATA_DIR:-${LOCALAPPDATA:?Set LOCALAPPDATA or MV_HOST_DATA_DIR}/MigrationValidator}"
        target: /app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 20s
      retries: 3
