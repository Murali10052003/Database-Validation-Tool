[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-validator"
version = "0.1.0"
description = "Generic, adapter-driven database migration validation platform (Phase 1)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Migration Validation Platform" }]
keywords = ["database", "migration", "validation", "oracle", "postgresql", "azure"]

dependencies = [
    "filelock>=3.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
oracle = ["oracledb>=2.2"]
postgresql = ["psycopg[binary]>=3.1"]
# Microsoft Entra ID (Azure AD) auth for Azure database targets.
entra = ["azure-identity>=1.17"]
# Drivers for later phases are intentionally omitted from Phase 1 installs.
mysql = ["mysql-connector-python>=8.4"]
sqlserver = ["pyodbc>=5.1"]
all-drivers = [
    "oracledb>=2.2",
    "psycopg[binary]>=3.1",
    "mysql-connector-python>=8.4",
    "pyodbc>=5.1",
]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",
    "fastapi>=0.111",
]

[project.scripts]
migration-validator = "app.cli:app"
migration-validator-web = "app.web.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP042"]  # Typer uses call defaults; str+Enum mixin is intentional.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]  # asserts are expected; long fixture lines are allowed.
