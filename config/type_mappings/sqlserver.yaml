# SQL Server / Azure SQL native type -> canonical logical type.
database: sqlserver

type_map:
  VARCHAR: STRING
  NVARCHAR: STRING
  CHAR: FIXED_STRING
  NCHAR: FIXED_STRING
  TEXT: TEXT
  NTEXT: TEXT

  BIT: BOOLEAN
  TINYINT: SMALLINT
  SMALLINT: SMALLINT
  INT: INTEGER
  BIGINT: BIGINT
  DECIMAL: DECIMAL
  NUMERIC: DECIMAL
  MONEY: DECIMAL
  SMALLMONEY: DECIMAL
  FLOAT: DOUBLE
  REAL: FLOAT

  DATE: DATE
  TIME: TIME
  DATETIME: TIMESTAMP
  DATETIME2: TIMESTAMP
  SMALLDATETIME: TIMESTAMP
  DATETIMEOFFSET: TIMESTAMP_TZ

  BINARY: BINARY
  VARBINARY: BLOB
  IMAGE: BLOB

  UNIQUEIDENTIFIER: UUID
  XML: XML
