# Oracle native type -> canonical logical type.
# Numeric precision and scale are preserved for range-aware comparison.
database: oracle

type_map:
  VARCHAR2: STRING
  NVARCHAR2: STRING
  VARCHAR: STRING
  CHAR: FIXED_STRING
  NCHAR: FIXED_STRING
  CLOB: TEXT
  NCLOB: TEXT
  LONG: TEXT

  NUMBER: DECIMAL
  NUMERIC: DECIMAL
  DECIMAL: DECIMAL
  DEC: DECIMAL
  INTEGER: INTEGER
  INT: INTEGER
  SMALLINT: SMALLINT
  FLOAT: FLOAT
  BINARY_FLOAT: FLOAT
  BINARY_DOUBLE: DOUBLE
  REAL: FLOAT

  DATE: TIMESTAMP           # Oracle DATE carries a time component.
  TIMESTAMP: TIMESTAMP
  "TIMESTAMP WITH TIME ZONE": TIMESTAMP_TZ
  "TIMESTAMP WITH LOCAL TIME ZONE": TIMESTAMP_TZ
  "INTERVAL YEAR TO MONTH": INTERVAL
  "INTERVAL DAY TO SECOND": INTERVAL

  RAW: BINARY
  "LONG RAW": BLOB
  BLOB: BLOB
  BFILE: BLOB

  ROWID: STRING
  UROWID: STRING
  XMLTYPE: XML
  JSON: JSON
