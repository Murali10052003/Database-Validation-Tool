# PostgreSQL native type -> canonical logical type.
# Used for both self-managed PostgreSQL and Azure Database for PostgreSQL.
database: postgresql

type_map:
  VARCHAR: STRING
  "CHARACTER VARYING": STRING
  CHAR: FIXED_STRING
  CHARACTER: FIXED_STRING
  BPCHAR: FIXED_STRING
  TEXT: TEXT
  CITEXT: TEXT
  NAME: STRING

  SMALLINT: SMALLINT
  INT2: SMALLINT
  INTEGER: INTEGER
  INT: INTEGER
  INT4: INTEGER
  BIGINT: BIGINT
  INT8: BIGINT
  SMALLSERIAL: SMALLINT
  SERIAL: INTEGER
  BIGSERIAL: BIGINT

  NUMERIC: DECIMAL
  DECIMAL: DECIMAL
  MONEY: DECIMAL
  REAL: FLOAT
  FLOAT4: FLOAT
  "DOUBLE PRECISION": DOUBLE
  FLOAT8: DOUBLE

  BOOLEAN: BOOLEAN
  BOOL: BOOLEAN

  DATE: DATE
  TIME: TIME
  "TIME WITHOUT TIME ZONE": TIME
  "TIME WITH TIME ZONE": UNKNOWN
  TIMETZ: UNKNOWN
  TIMESTAMP: TIMESTAMP
  "TIMESTAMP WITHOUT TIME ZONE": TIMESTAMP
  "TIMESTAMP WITH TIME ZONE": TIMESTAMP_TZ
  TIMESTAMPTZ: TIMESTAMP_TZ
  INTERVAL: INTERVAL

  BYTEA: BLOB

  UUID: UUID
  JSON: JSON
  JSONB: JSON
  XML: XML
