# MySQL native type -> canonical logical type.
database: mysql

type_map:
  VARCHAR: STRING
  CHAR: FIXED_STRING
  TINYTEXT: TEXT
  TEXT: TEXT
  MEDIUMTEXT: TEXT
  LONGTEXT: TEXT

  TINYINT: SMALLINT
  SMALLINT: SMALLINT
  MEDIUMINT: INTEGER
  INT: INTEGER
  INTEGER: INTEGER
  BIGINT: BIGINT
  DECIMAL: DECIMAL
  NUMERIC: DECIMAL
  FLOAT: FLOAT
  DOUBLE: DOUBLE
  BOOL: BOOLEAN
  BOOLEAN: BOOLEAN
  BIT: BOOLEAN

  DATE: DATE
  TIME: TIME
  DATETIME: TIMESTAMP
  TIMESTAMP: TIMESTAMP
  YEAR: SMALLINT

  BINARY: BINARY
  VARBINARY: BLOB
  TINYBLOB: BLOB
  BLOB: BLOB
  MEDIUMBLOB: BLOB
  LONGBLOB: BLOB

  JSON: JSON
  ENUM: ENUM
