# Example: validate an Oracle → Azure Database for PostgreSQL migration.
#
# Secrets are read from the environment using ${VAR} interpolation so this file
# can be committed safely. Copy .env.example to .env and fill in credentials.

migration:
  name: HR Oracle to Azure PostgreSQL
  description: Validate the HR schema migration into Azure Database for PostgreSQL.

source:
  type: oracle
  platform: self_managed
  host: ${SOURCE_HOST:-localhost}
  port: ${SOURCE_PORT:-1521}
  service: ${SOURCE_SERVICE:-ORCLPDB1}
  username: ${SOURCE_USERNAME}
  password: ${SOURCE_PASSWORD}
  connect_timeout_seconds: 30

target:
  type: azure_postgresql
  platform: azure
  host: ${TARGET_HOST}
  port: ${TARGET_PORT:-5432}
  database: ${TARGET_DATABASE:-appdb}
  username: ${TARGET_USERNAME}
  password: ${TARGET_PASSWORD}
  # auth_method: entra   # use a Microsoft Entra ID token instead of a password
  ssl: true

mapping:
  schemas:
    HR: hr
  tables:
    HR.EMPLOYEES: employees
  columns:
    HR.EMPLOYEES.EMP_ID: employee_id
  excluded_objects:
    - HR.TEMP_IMPORT
  type_overrides: {}

validation:
  profile: standard
  schema:
    compare_columns: true
    compare_indexes: true
  data:
    checksum: false
