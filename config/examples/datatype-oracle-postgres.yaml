migration:
  name: Datatype certification - Oracle to PostgreSQL
source:
  type: oracle
  platform: self_managed
  host: ${DT_ORACLE_HOST}
  port: ${DT_ORACLE_PORT:-1521}
  service: ${DT_ORACLE_SERVICE}
  username: ${DT_ORACLE_USERNAME}
  password: ${DT_ORACLE_PASSWORD}
target:
  type: azure_postgresql
  platform: self_managed
  host: ${DT_TARGET_HOST}
  port: ${DT_TARGET_PORT:-5432}
  database: ${DT_TARGET_DATABASE}
  username: ${DT_TARGET_USERNAME}
  password: ${DT_TARGET_PASSWORD}
  ssl: ${DT_TARGET_SSL:-true}
mapping:
  schemas:
    MV_DT_SOURCE: mv_dt_good
validation:
  profile: full
  data:
    chunk_size: 100