migration:
  name: Datatype certification - PostgreSQL to PostgreSQL
source:
  type: azure_postgresql
  platform: self_managed
  host: ${DT_SOURCE_HOST}
  port: ${DT_SOURCE_PORT:-5432}
  database: ${DT_SOURCE_DATABASE}
  username: ${DT_SOURCE_USERNAME}
  password: ${DT_SOURCE_PASSWORD}
  ssl: ${DT_SOURCE_SSL:-true}
target:
  type: azure_postgresql
  platform: self_managed
  host: ${DT_TARGET_HOST}
  port: ${DT_TARGET_PORT:-5432}
  database: ${DT_TARGET_DATABASE}
  username: ${DT_TARGET_USERNAME}
  password: ${DT_TARGET_PASSWORD}
  ssl: ${DT_TARGET_SSL:-true}
mapping:
  schemas:
    mv_dt_source: mv_dt_good
validation:
  profile: full
  data:
    chunk_size: 100